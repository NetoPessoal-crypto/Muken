name: migrations-check

on:
  pull_request:
    paths:
      - 'supabase/migrations/**'
  push:
    paths:
      - 'supabase/migrations/**'

jobs:
  migrations-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run DB genealogy test
        env:
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: node scripts/db-run-genealogy-test.mjs

  e2e-genealogy:
    runs-on: ubuntu-latest
    needs: migrations-check
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run E2E genealogy (create user + seed + UI test)
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          node scripts/e2e_create_user_seed_and_output.mjs > /tmp/e2e_seed.json
          node_modules/.bin/playwright test e2e/genealogy.spec.js --reporter=list
